services:
  api:
    build: .
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      NODE_ENV: production

    volumes:
      - "/var/lib/juancloud-metrics/nvme:/metrics/nvme:ro"
      - "/srv/backups/.juancloud-metrics:/metrics/backup:ro"
      - "/var/lib/juancloud-health:/metrics/health:ro"

    read_only: true

    tmpfs:
      - /tmp

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
