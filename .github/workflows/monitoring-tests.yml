name: Monitoring unit tests
on:
  push:
    paths:
      - 'monitoring/**'
      - '.github/workflows/monitoring-tests.yml'
  pull_request:
    paths:
      - 'monitoring/**'
      - '.github/workflows/monitoring-tests.yml'
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python syntax
        run: python -m py_compile monitoring/monitor.py
      - name: Run health-rule unit tests
        run: python -m unittest discover -s monitoring/tests -v
